
services:
  postgres:
    image: postgres:15-alpine
    container_name: piitrade-postgres
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass123
      POSTGRES_DB: test_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d test_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - piitrade-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: piitrade-backend
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - piitrade-network

volumes:
  postgres_data:

networks:
  piitrade-network:
    driver: bridge
  